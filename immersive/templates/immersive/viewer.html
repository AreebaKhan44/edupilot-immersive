{% load static %}<!doctype html><html lang="{{ language }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D · {{ lesson.title }}</title><link rel="stylesheet" href="{% static 'immersive/css/app.css' %}">
<script type="importmap">{"imports":{"three":"{% static 'immersive/vendor/three/three.module.js' %}","three/addons/":"{% static 'immersive/vendor/three/jsm/' %}"}}</script></head>
<body class="viewer">
<div id="stage"></div><div id="tip"></div>
<div class="hud" id="hud"><div class="small" id="counter"></div><h2 id="stitle">Loading…</h2><ul id="points"></ul><div class="narr" id="narr"></div><div class="dots" id="dots"></div>
<div class="vhint" id="vhint">🔊 Tap anywhere to start the voice narration</div><div class="small" id="vmsg"></div>
<details class="vset"><summary>🎚️ Voice settings</summary>
<label>Voice</label><select id="vsel"></select>
<label>Speed <span id="vratev"></span></label><input type="range" id="vrate" min="0.6" max="1.6" step="0.05" value="0.95">
<label>Voice source</label><select id="vsrc"><option value="auto">Automatic (device voice, else server voice)</option><option value="browser">Device voice only</option><option value="server">Server voice (gTTS / espeak)</option></select>
<div class="small" id="vengine"></div><button class="btn sm" id="vtest" type="button">▶ Test voice</button></details>
<div class="small" style="margin-top:10px">🖱️ Drag = rotate · Scroll = zoom · Click objects to hear their names · Space = pause · 🥽 “Enter VR” works on WebXR headsets</div></div>
<div class="topr"><a class="btn sm" href="{% url 'lesson_detail' lesson.pk %}">⬅ Lesson</a><a class="btn sm" href="{% url 'quiz' lesson.pk %}">📝 Quiz</a></div>
<div class="bar"><button class="btn" id="prev">◀ Prev</button><button class="btn primary" id="tour">▶ Auto tour</button><button class="btn" id="speak">🔇 Mute</button><button class="btn" id="pause" disabled>⏸ Pause</button><button class="btn" id="repeat">🔁 Repeat</button><button class="btn" id="mic">🎤 Voice commands</button><button class="btn" id="next">Next ▶</button><button class="btn" id="spin">⟳ Auto-rotate</button></div>
<script>window.EDUPILOT={manifestUrl:"{% url 'api_manifest' lesson.pk %}",eventsUrl:"{% url 'api_events' %}",lessonId:{{ lesson.pk }},locale:"{{ language }}"};</script>
<script type="module" src="{% static 'immersive/js/viewer.js' %}"></script></body></html>
